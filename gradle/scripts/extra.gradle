// Nix supplies OpenJDK, rather than upstream's automatically downloaded Azul JDK.
// Keep this platform-specific override out of build.gradle for easy upstream merges.
if (System.getenv('JDK8_HOME')) {
    java.toolchain.vendor.unset()
}
